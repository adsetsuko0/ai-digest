# Production stack: images come from GHCR, nothing is built on the server.
# On the server: bash deploy/deploy.sh <version>

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-image: &app-image ghcr.io/adsetsuko0/ai-digest:${AI_DIGEST_VERSION:?Set AI_DIGEST_VERSION in .env}

x-app-environment: &app-environment
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-digest_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-digest_db}
  DATABASE_SYNC_URL: postgresql+psycopg2://${POSTGRES_USER:-digest_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-digest_db}
  REDIS_URL: redis://redis:6379/0
  RATE_LIMIT_STORAGE_URI: redis://redis:6379/1
  CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-digest}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672//
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  LOG_JSON: "true"
  LLM_PROVIDER: ${LLM_PROVIDER:-fake}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_DAILY_TOKEN_BUDGET: ${LLM_DAILY_TOKEN_BUDGET:-200000}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-384}

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-digest_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-digest_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:7
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    mem_limit: 512m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-digest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      # loopback only: reach the UI through an SSH tunnel
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    logging: *default-logging

  app:
    image: *app-image
    restart: unless-stopped
    environment:
      <<: *app-environment
      # Caddy is the only client of this port (it is not published), so the proxy
      # headers can be trusted and the rate limiter sees the real client IP
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging: *default-logging

  worker:
    image: *app-image
    restart: unless-stopped
    environment:
      <<: *app-environment
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
      WORKER_METRICS_PORT: "9100"
    command:
      - sh
      - -c
      - >-
        rm -rf "$$PROMETHEUS_MULTIPROC_DIR" &&
        mkdir -p "$$PROMETHEUS_MULTIPROC_DIR" &&
        exec celery -A app.worker.celery_app:celery_app worker --loglevel=INFO --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    logging: *default-logging

  beat:
    image: *app-image
    restart: unless-stopped
    environment: *app-environment
    command: celery -A app.worker.celery_app:celery_app beat --loglevel=INFO --schedule /tmp/celerybeat-schedule
    depends_on:
      rabbitmq:
        condition: service_healthy
    logging: *default-logging

  caddy:
    image: caddy:2.11
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: *default-logging

volumes:
  postgres_data:
  rabbitmq_data:
  caddy_data:
  caddy_config: