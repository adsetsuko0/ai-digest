x-app-environment: &app-environment
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-digest_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-digest_db}
  DATABASE_SYNC_URL: postgresql+psycopg2://${POSTGRES_USER:-digest_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-digest_db}
  REDIS_URL: redis://redis:6379/0
  RATE_LIMIT_STORAGE_URI: redis://redis:6379/1
  CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-digest}:${RABBITMQ_PASSWORD}@rabbitmq:5672//
  LOG_JSON: "true"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-digest_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-digest_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-digest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  app:
    build: .
    env_file: .env
    environment: *app-environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build: .
    env_file: .env
    environment:
      <<: *app-environment
      # task processes write their metrics to files here, the main process sums them up
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
      WORKER_METRICS_PORT: "9100"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # the directory must exist and be empty before Python starts (stale files from a
    # previous run would be counted again); $$ is a literal $ for the shell
    command:
      - sh
      - -c
      - >-
        rm -rf "$$PROMETHEUS_MULTIPROC_DIR" &&
        mkdir -p "$$PROMETHEUS_MULTIPROC_DIR" &&
        exec celery -A app.worker.celery_app:celery_app worker --loglevel=INFO --concurrency=2

  beat:
    build: .
    env_file: .env
    environment: *app-environment
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: celery -A app.worker.celery_app:celery_app beat --loglevel=INFO --schedule /tmp/celerybeat-schedule

  # Monitoring is optional: start it with `docker compose --profile monitoring up -d`
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - app
      - worker

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
    # refuse to start without a password instead of falling back to a weak default
    entrypoint:
      - sh
      - -c
      - >-
        if [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ]; then
        echo "Set GRAFANA_PASSWORD in .env"; exit 1; fi;
        exec /run.sh
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data: