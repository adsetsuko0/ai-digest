name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a new push cancels the older run of the same branch
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=app --cov-fail-under=80

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: mypy

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: digest_user
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: digest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digest_user -d digest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-secret-key-0123456789abcdefghijklmnopqrstuvwxyz
      DATABASE_URL: postgresql+asyncpg://digest_user:ci-only-password@localhost:5432/digest_test
      DATABASE_SYNC_URL: postgresql+psycopg2://digest_user:ci-only-password@localhost:5432/digest_test
      TEST_DATABASE_URL: postgresql+asyncpg://digest_user:ci-only-password@localhost:5432/digest_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply to an empty database
        run: alembic upgrade head
      - name: Tests on real PostgreSQL
        run: pytest -m integration -v

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Compose files are valid
      - name: Production compose and Caddyfile are valid
        env:
          POSTGRES_PASSWORD: ci
          RABBITMQ_PASSWORD: ci
          SECRET_KEY: ci-secret-key-0123456789abcdefghijklmnopqrstuvwxyz
          DOMAIN: example.com
          AI_DIGEST_VERSION: ci
        run: |
          docker compose -f docker-compose.prod.yml config -q
          docker run --rm -e DOMAIN=example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11 caddy validate --config /etc/caddy/Caddyfile
        env:
          POSTGRES_PASSWORD: ci
          RABBITMQ_PASSWORD: ci
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose --profile monitoring config -q
      - name: Build the image
        run: docker build -t ai-digest:ci .
      - name: The worker code imports (catches dependencies missing from requirements.txt)
        run: |
          docker run --rm \
            -e DATABASE_URL=postgresql+asyncpg://u:p@localhost:5432/d \
            -e SECRET_KEY=ci-secret-key-0123456789abcdefghijklmnopqrstuvwxyz \
            ai-digest:ci python -c "import app.worker.tasks"
      - name: Start the API container
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_URL=postgresql+asyncpg://u:p@localhost:5432/d \
            -e SECRET_KEY=ci-secret-key-0123456789abcdefghijklmnopqrstuvwxyz \
            ai-digest:ci
      - name: /health answers
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
      - name: /metrics answers
        run: curl -fsS http://localhost:8000/metrics > /dev/null
      - name: The container does not run as root
        run: test "$(docker exec api id -u)" = "1000"